<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sigma RH · Meu portal</title>
<style>
  .cartao{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:12px;font-family:inherit;color:var(--graphite)}
  button.cartao{cursor:pointer}
  .cartao.urgente{border-color:#F59E0B;background:#FFFBEB}
  .cartao.ok{border-color:#BBF7D0;background:#F0FDF4}
  .cartao .rot{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .cartao b{display:block;font-size:19px;margin:4px 0 6px;line-height:1.3}
  .cartao span.t{font-size:16px;color:var(--ink-soft);line-height:1.45;display:block}
  .cartao .ir{display:inline-block;margin-top:10px;font-weight:700;color:var(--blue);font-size:17px}
  .folha{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .cab{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:15px;margin-bottom:12px}
  .cab span{color:var(--muted);display:block;font-size:13px}
  .res{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
  .res div{background:#F4F6FA;border-radius:10px;padding:8px 4px;text-align:center}
  .res b{display:block;font-size:20px;color:var(--graphite)}
  .res span{font-size:12px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
  th{font-size:12px;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:2px solid var(--line)}
  td{padding:9px 4px;border-bottom:1px solid #EEF1F5;vertical-align:top}
  tr.fds td{color:var(--muted);background:#FAFBFC}
  tr.marcado td{background:#FEF2F2}
  td.obs{font-size:13px;color:var(--ink-soft)}
  .acoes{display:grid;gap:10px;padding-bottom:20px}
  td.alm{font-size:13px;line-height:1.25;color:var(--ink-soft)}
  .dias{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
  .dias button{min-height:56px;border:2px solid #CBD5E1;background:#fff;border-radius:12px;font:700 16px var(--font-ui);
    color:var(--graphite);cursor:pointer;line-height:1.1}
  .dias button small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
  .dias button[aria-pressed="true"]{border-color:#DC2626;background:#FEF2F2;color:#B91C1C}
  .voltar{background:none;border:0;color:var(--blue);font:600 17px var(--font-ui);min-height:52px;cursor:pointer;padding:0}
  .recibo{text-align:center;padding:10px 0}
  .item-al{padding:10px 0;border-bottom:1px solid #EEF1F5;display:flex;flex-direction:column;gap:2px}
  .item-al:last-child{border-bottom:0}
  .item-al b{font-size:16px;color:var(--graphite)}
  .item-al span{font-size:14px;color:var(--ink-soft)}
  .item-al .ok-al{color:#15803D;font-weight:600}
  .item-al .esp-al{color:#B45309;font-weight:600}
  .sub-al{font:700 18px var(--font-d);color:var(--graphite);margin:18px 0 8px}
  .recibo .cod{font-family:ui-monospace,Consolas,monospace;font-size:22px;letter-spacing:.08em;background:#fff;
    border:1px dashed #94A3B8;border-radius:10px;padding:10px;margin:10px 0 16px;color:var(--graphite)}
</style>
</head>
<body>
<main id="tela"><p class="guia">Abrindo...</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="rh-ui.js"></script>
<script src="rh-demo.js"></script>
<script src="rh-demo-ponto.js"></script>
<script>
/* Portal do colaborador. Link pessoal (?k=token) e PIN do treinamento.
   Início com o que está pendente para a pessoa; o espelho de ponto do mês é a
   primeira coisa, com Assinar ou Não concordo, uma decisão por vez. */
const VERSAO = '2026-10-12 · portal · demonstração';
(async () => {
  console.log('[Sigma RH] ' + VERSAO);
  const { token } = SigmaRH.publico({ titulo: 'Meu portal' });
  const { esc, rpc, frase, pedirPin, fmt } = SigmaRH;
  const tela = document.getElementById('tela');
  const erro = t => `<div class="recado erro">${esc(t)}</div>`;
  const quando = iso => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  if (!token) { tela.innerHTML = erro('Abra esta página pelo seu link pessoal. Se não tem o link, peça ao RH.'); return; }

  let esp = null, marcados = [];

  async function inicio() {
    tela.innerHTML = '<p class="guia">Carregando...</p>';
    const { data: d, error } = await rpc('col_inicio', { p_token: token });
    if (error) { tela.innerHTML = erro(frase(error)); return; }
    const e = d.espelho;
    let card;
    if (e && e.situacao === 'discordou') card = `<div class="cartao">
        <span class="rot">Espelho de ponto · ${esc(e.nome)}</span><b>O RH está vendo o que você apontou</b>
        <span class="t">Quando corrigir ou responder, o espelho volta aqui para você assinar.</span></div>`;
    else if (e) card = `<button class="cartao urgente" id="abrir-esp" data-c="${esc(e.competencia)}">
        <span class="rot">Espelho de ponto · ${esc(e.nome)}</span>
        <b>${e.resposta_rh ? 'O RH respondeu. Confira de novo e assine' : 'Esperando a sua assinatura'}</b>
        <span class="t">Prazo: até ${esc(fmt.data(e.prazo))}.</span><span class="ir">Conferir e assinar &#8250;</span></button>`;
    else if (d.ultimo_assinado) card = `<div class="cartao ok"><span class="rot">Espelho de ponto</span>
        <b>Tudo assinado</b><span class="t">${esc(d.ultimo_assinado.nome)} assinado em ${esc(quando(d.ultimo_assinado.assinado_em))}.</span></div>`;
    else card = `<div class="cartao"><span class="rot">Espelho de ponto</span><b>Nada para assinar agora</b>
        <span class="t">Quando o RH mandar o espelho do mês, ele aparece aqui.</span></div>`;
    const t = d.treinamentos;
    const am = (await rpc('col_almox', { p_token: token })).data;
    const cardAlmox = !am ? '' : am.a_confirmar
      ? `<button class="cartao urgente" id="abrir-almox"><span class="rot">Almoxarifado</span>
          <b>Confirme o EPI que você recebeu</b><span class="t">${am.a_confirmar} item(ns) entregue(s) esperando a sua confirmação.</span>
          <span class="ir">Ver e confirmar &#8250;</span></button>`
      : `<button class="cartao" id="abrir-almox"><span class="rot">Almoxarifado</span>
          <b>O que está com você</b><span class="t">${am.epi.length} EPI e ${am.material.length} retirada(s) de material.</span>
          <span class="ir">Ver &#8250;</span></button>`;
    tela.innerHTML = `<h1>Olá, ${esc(d.nome.split(' ')[0])}</h1>
      <p class="guia">${esc(d.funcao)}</p>
      ${card}
      ${cardAlmox}
      <div class="cartao"><span class="rot">Meus treinamentos</span>
        <b>${t.aptos} de ${t.exigidos} em dia</b>
        <span class="t">${t.vencendo ? `${t.vencendo} vence nos próximos 30 dias.` : 'Nenhum vencendo.'}</span></div>
      ${d.avisos.map(a => `<div class="cartao"><span class="rot">Aviso do RH · ${esc(fmt.data(a.em))}</span>
        <b>${esc(a.titulo)}</b><span class="t">${esc(a.texto)}</span></div>`).join('')}`;
  }

  /* Almoxarifado: EPI entregue (confirma com PIN, substitui a ficha em papel) e material retirado. */
  async function almoxarifado() {
    tela.innerHTML = '<p class="guia">Carregando...</p>';
    const { data: a, error } = await rpc('col_almox', { p_token: token });
    if (error) { tela.innerHTML = erro(frase(error)); return; }
    const pend = a.epi.filter(e => e.situacao === 'confirmar');
    const ok = a.epi.filter(e => e.situacao !== 'confirmar');
    const linhaEpi = e => `<div class="item-al"><b>${esc(e.qtd)} ${esc(e.unidade)} · ${esc(e.item)}</b>
      <span>${esc(e.ca)} · entregue em ${esc(fmt.data(e.entregue_em))} · troca ${esc(e.troca)}</span>
      ${e.situacao === 'confirmado' ? `<span class="ok-al">Confirmado em ${esc(fmt.data(e.confirmado_em))}</span>` : ''}</div>`;
    tela.innerHTML = `<div class="passo-n">Almoxarifado</div><h1>O que está com você</h1>
      ${pend.length ? `<div class="recado info">O almoxarifado entregou ${pend.length} item(ns) de EPI. Confira se recebeu tudo e confirme com o seu PIN.</div>
        <div class="folha">${pend.map(linhaEpi).join('')}</div><div id="err"></div>
        <button class="st-btn" id="epi-ok">Recebi, confirmar com PIN</button>
        <button class="st-btn" data-tom="quieto" id="epi-nao" style="margin-top:10px">Não recebi algum item</button>` : ''}
      <h2 class="sub-al">EPI com você</h2>
      <div class="folha">${ok.length ? ok.map(linhaEpi).join('') : '<p class="guia">Nenhum EPI confirmado ainda.</p>'}</div>
      <h2 class="sub-al">Material que você retirou</h2>
      <div class="folha">${a.material.map(m => `<div class="item-al"><b>${esc(m.qtd)} ${esc(m.unidade)} · ${esc(m.descricao)}</b>
        <span>Plaqueta ${esc(m.plaqueta)} · ${esc(m.ls)}</span>
        <span class="${m.situacao === 'liberada' ? 'ok-al' : 'esp-al'}">${m.situacao === 'liberada' ? 'Liberado em ' + esc(fmt.data(m.liberado_em)) : 'Pedido, esperando o almoxarifado liberar'}</span></div>`).join('')}</div>
      <button class="voltar" id="inicio">&#8249; Voltar ao início</button>`;
  }
  async function confirmarEpi() {
    const a = (await rpc('col_almox', { p_token: token })).data;
    const ids = a.epi.filter(e => e.situacao === 'confirmar').map(e => e.id);
    const pin = await pedirPin({ titulo: 'Confirmar o EPI recebido', texto: 'Digite seu PIN de 4 números. Vale como a sua assinatura na ficha de EPI.' });
    if (!pin) return;
    const { data, error } = await rpc('col_epi_confirmar', { p_token: token, p_pin: pin, p_ids: ids });
    if (error || data?.ok === false) { tela.querySelector('#err').innerHTML = erro(error ? frase(error) : data.mensagem); return; }
    tela.innerHTML = `<div class="recibo"><div class="recado ok" style="text-align:left">Pronto. Recebimento do EPI confirmado.</div>
      <p class="guia">Confirmado em ${esc(quando(data.confirmado_em))}. Código de conferência:</p>
      <div class="cod">${esc(data.codigo.replace(/(.{4})(?=.)/g, '$1 '))}</div>
      <button class="st-btn" id="abrir-almox">Ver o que está com você</button></div>`;
  }

  async function espelho(c) {
    tela.innerHTML = '<p class="guia">Carregando o espelho...</p>';
    const { data, error } = await rpc('col_espelho', { p_token: token, p_competencia: c });
    if (error) { tela.innerHTML = erro(frase(error)); return; }
    esp = data; marcados = [];
    const r = esp.resumo;
    tela.innerHTML = `<div class="passo-n">Espelho de ponto${esp.versao > 1 ? ' · versão corrigida' : ''}</div>
      <h1>${esc(esp.nome_comp.replace(/^./, m => m.toUpperCase()))}</h1>
      ${esp.resposta_rh ? `<div class="recado info"><b>Resposta do RH:</b> ${esc(esp.resposta_rh)}</div>` : ''}
      <p class="guia">Confira os dias e role até o fim. Se estiver tudo certo, assine. Se algum dia estiver errado, toque em <b>Não concordo</b>.</p>
      <div class="folha">
        <div class="cab"><div><span>Nome</span>${esc(esp.nome)}</div><div><span>Matrícula</span>${esc(esp.matricula)}</div>
          <div><span>Função</span>${esc(esp.funcao)}</div><div><span>Empresa</span>${esc(esp.empresa)}</div></div>
        <div class="res"><div><b>${r.dias_trabalhados}</b><span>dias</span></div><div><b>${esc(r.horas_normais)}</b><span>normais</span></div>
          <div><b>${esc(r.horas_extras)}</b><span>extras</span></div><div><b>${r.faltas}</b><span>${r.faltas === 1 ? 'falta' : 'faltas'}</span></div></div>
        <table><thead><tr><th>Dia</th><th>Entrada</th><th>Almoço</th><th>Saída</th><th>Total</th></tr></thead><tbody>
        ${esp.dias.map(l => l.total
          ? `<tr><td><b>${esc(l.dia)}</b> ${esc(l.semana)}</td><td>${esc(l.e1)}</td><td class="alm">${esc(l.s1)}<br>${esc(l.e2)}</td><td>${esc(l.s2)}</td><td>${esc(l.total)}</td></tr>`
            + (l.obs ? `<tr><td></td><td colspan="4" class="obs">${esc(l.obs)}</td></tr>` : '')
          : `<tr class="fds"><td><b>${esc(l.dia)}</b> ${esc(l.semana)}</td><td colspan="4">${esc(l.obs)}</td></tr>`).join('')}
        </tbody></table>
      </div>
      <div id="err"></div>
      <div class="acoes"><button class="st-btn" id="assinar">Está certo, assinar</button>
        <button class="st-btn" data-tom="quieto" id="discordar">Não concordo</button>
        <button class="voltar" id="inicio">&#8249; Voltar ao início</button></div>`;
  }

  async function assinar() {
    const pin = await pedirPin({ titulo: 'Assinar o espelho', texto: 'Digite seu PIN de 4 números. Com ele você confirma que os dias estão certos.' });
    if (!pin) return;
    const { data, error } = await rpc('col_ponto_assinar', { p_token: token, p_pin: pin, p_competencia: esp.competencia, p_versao: esp.versao });
    if (error || data?.ok === false) { tela.querySelector('#err').innerHTML = erro(error ? frase(error) : data.mensagem); tela.querySelector('#err').scrollIntoView({ block: 'center' }); return; }
    tela.innerHTML = `<div class="recibo"><div class="recado ok" style="text-align:left">Pronto. Seu espelho de ${esc(esp.nome_comp)} está assinado.</div>
      <p class="guia">Assinado em ${esc(quando(data.assinado_em))}. Código de conferência:</p>
      <div class="cod">${esc(data.codigo.replace(/(.{4})(?=.)/g, '$1 '))}</div>
      <button class="st-btn" id="inicio">Voltar ao início</button></div>`;
  }

  // Não concordo: primeiro os dias (um toque por dia), depois o motivo, depois o PIN.
  function discordar() {
    const uteis = esp.dias.filter(l => l.total || /Falta|Feriado/.test(l.obs));
    tela.innerHTML = `<div class="passo-n">Não concordo · 1 de 2</div><h1>Quais dias estão errados?</h1>
      <p class="guia">Toque em cada dia errado. Toque de novo para desmarcar.</p>
      <div class="dias">${uteis.map(l => `<button type="button" data-dia="${esc(l.dia)}" aria-pressed="false">${esc(l.dia.slice(0, 2))}<small>${esc(l.semana)}</small></button>`).join('')}</div>
      <div id="err"></div>
      <button class="st-btn" id="dias-ok">Continuar</button>
      <button class="voltar" id="volta-esp">&#8249; Voltar para o espelho</button>`;
  }
  function motivo() {
    tela.innerHTML = `<div class="passo-n">Não concordo · 2 de 2</div><h1>O que está errado?</h1>
      <p class="guia">Dias marcados: <b>${esc(marcados.join(', '))}</b>. O RH vai ler e te responder aqui.</p>
      <div class="st-field"><label for="mot">Explique com suas palavras</label>
        <textarea id="mot" maxlength="500" placeholder="Ex.: fiquei até 18h30 e no espelho saiu 16h30"></textarea></div>
      <div id="err"></div>
      <button class="st-btn" id="enviar-disc">Enviar para o RH</button>
      <button class="voltar" id="volta-dias">&#8249; Voltar para os dias</button>`;
    tela.querySelector('#mot').focus();
  }
  async function enviarDiscordancia() {
    const m = tela.querySelector('#mot').value.trim();
    if (m.replace(/[^a-zà-ú]/gi, '').length < 10) { tela.querySelector('#err').innerHTML = erro('Escreva um pouco mais, para o RH entender (pelo menos 10 letras).'); return; }
    const pin = await pedirPin({ titulo: 'Enviar para o RH', texto: 'Digite seu PIN de 4 números.' });
    if (!pin) return;
    const { data, error } = await rpc('col_ponto_discordar', { p_token: token, p_pin: pin, p_competencia: esp.competencia, p_dias: marcados, p_motivo: m });
    if (error || data?.ok === false) { tela.querySelector('#err').innerHTML = erro(error ? frase(error) : data.mensagem); return; }
    tela.innerHTML = `<div class="recado ok">Enviado. O RH vai conferir os dias ${esc(marcados.join(', '))}.</div>
      <p class="guia">Quando o RH corrigir ou responder, o espelho volta aqui para você assinar. Você não precisa ir até o RH.</p>
      <button class="st-btn" id="inicio">Voltar ao início</button>`;
  }

  tela.addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.id === 'abrir-esp') espelho(b.dataset.c);
    else if (b.id === 'abrir-almox') almoxarifado();
    else if (b.id === 'epi-ok') confirmarEpi();
    else if (b.id === 'epi-nao') tela.querySelector('#err').innerHTML = '<div class="recado info">Não confirme. Volte ao almoxarifado e peça o que faltou; o almoxarife corrige a entrega e ela aparece aqui de novo.</div>';
    else if (b.id === 'inicio') inicio();
    else if (b.id === 'assinar') assinar();
    else if (b.id === 'discordar' || b.id === 'volta-dias') { discordar(); marcados.forEach(d => { const x = tela.querySelector(`[data-dia="${d}"]`); if (x) x.setAttribute('aria-pressed', 'true'); }); }
    else if (b.id === 'volta-esp') espelho(esp.competencia);
    else if (b.dataset.dia) {
      const on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', String(on));
      marcados = on ? marcados.concat(b.dataset.dia) : marcados.filter(x => x !== b.dataset.dia);
    }
    else if (b.id === 'dias-ok') {
      if (!marcados.length) { tela.querySelector('#err').innerHTML = erro('Toque em pelo menos um dia.'); return; }
      marcados.sort(); motivo();
    }
    else if (b.id === 'enviar-disc') enviarDiscordancia();
  });
  inicio();
})();
</script>
</body>
</html>
