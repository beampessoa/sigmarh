<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sigma RH</title>
<style>body{font-family:system-ui,sans-serif;background:#F1F4F9;color:#6B7280;display:flex;align-items:center;
  justify-content:center;min-height:100vh;margin:0;font-size:15px}</style>
</head>
<body>
<p id="msg">Abrindo o Sigma RH...</p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="rh-ui.js"></script>
<script>
// Porta de entrada: com sessão vai ao painel, sem sessão vai ao login.
// A guarda de papel fica no login e na casca.
(async () => {
  try {
    const ss = await SigmaRH.sessao();
    location.replace(ss ? 'shell.html' : 'login.html');
  } catch (e) {
    document.getElementById('msg').textContent = 'O sistema não carregou. Confira a internet e recarregue a página.';
  }
})();
</script>
</body>
</html>
